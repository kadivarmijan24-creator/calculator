
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7652D6">
<title>RUPEEVAULT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --bg:#F8F7FC;
 --white:#FFFFFF;
 --violet:#7652D6;
 --violet-dark:#5633A9;
 --light:#F0EBFF;
 --text:#292638;
 --muted:#9993A8;
 --line:#EAE6F2;
}

body{
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 padding:18px 12px;
}

.app{max-width:590px;margin:auto}

header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:22px;
}

.brand{display:flex;align-items:center;gap:11px}

.logo{
 width:46px;height:46px;
 border-radius:15px;
 background:linear-gradient(145deg,#9B7BFA,#6841C2);
 color:white;
 display:grid;place-items:center;
 font-size:28px;font-weight:800;
 box-shadow:0 5px 15px #7652D630;
}

.brand h1{font-size:19px;letter-spacing:1.5px}
.brand small{
 color:var(--violet);
 font-size:9px;
 letter-spacing:2px;
}

.status{
 background:#EAE6FA;
 color:#6841C2;
 padding:8px 11px;
 border-radius:30px;
 font-size:10px;
 font-weight:bold;
}

.hero{
 background:linear-gradient(125deg,#7652D6,#5633A9);
 color:white;
 padding:24px;
 border-radius:21px;
 margin-bottom:23px;
 position:relative;
 overflow:hidden;
 box-shadow:0 9px 22px #7652D625;
}

.hero:after{
 content:"₹";
 position:absolute;
 right:15px;top:-42px;
 font-size:175px;
 font-weight:800;
 color:#ffffff12;
}

.hero-label{
 color:#E8DFFF;
 font-size:11px;
 letter-spacing:2px;
}

.total{
 font-size:clamp(35px,8vw,47px);
 font-weight:800;
 margin:12px 0;
 color:white;
 position:relative;
 z-index:1;
 word-break:break-word;
}

.hero-info{
 display:flex;
 gap:20px;
 font-size:11px;
 color:#E8DFFF;
}

.heading{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:11px;
}

.heading h2{font-size:16px}
.heading span{font-size:10px;color:var(--muted)}

.cash-box{
 background:white;
 border:1px solid var(--line);
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 5px 20px #25251d08;
}

.note-row{
 display:grid;
 grid-template-columns:100px minmax(0,1fr) 82px;
 gap:10px;
 align-items:center;
 min-height:88px;
 padding:12px 10px;
 border-bottom:1px solid var(--line);
 transition:.2s;
}

.note-row:last-child{border-bottom:none}
.note-row:focus-within{background:#FCFAFF}

.note-photo{
 width:96px;
 height:49px;
 object-fit:contain;
 border:1px solid #F0EDF5;
 border-radius:6px;
 background:white;
}

.note-info{min-width:0}

.note-value{
 font-size:22px;
 font-weight:800;
 color:#393247;
 margin-bottom:8px;
}

.note-total{
 font-size:20px;
 font-weight:800;
 color:var(--violet);
 word-break:break-word;
}

.qty label{
 display:block;
 font-size:9px;
 font-weight:bold;
 color:#AAA3B7;
 margin-bottom:6px;
 text-align:center;
}

.qty input{
 width:100%;
 height:39px;
 border:1px solid #E9E4F1;
 border-radius:10px;
 background:#FAF9FD;
 text-align:center;
 font-size:16px;
 font-weight:800;
 outline:none;
 color:#333;
}

.qty input:focus{
 border-color:var(--violet);
 background:white;
}

.summary{
 background:white;
 border:1px solid var(--line);
 border-radius:17px;
 padding:17px;
 margin-top:18px;
}

.summary h3{font-size:15px;margin-bottom:12px}

.summary-row{
 display:flex;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid var(--line);
 font-size:12px;
 color:var(--muted);
}

.summary-row strong{color:#393247}

.grand{
 margin-top:14px;
 padding:18px;
 border-radius:13px;
 background:linear-gradient(120deg,#F1ECFF,#E8DEFF);
 border:1px solid #DCCEFF;
}

.grand-label{
 color:#6841C2;
 font-size:11px;
 font-weight:800;
 letter-spacing:1px;
}

.grand-total{
 color:#6841C2;
 font-size:clamp(27px,7vw,35px);
 font-weight:800;
 margin-top:8px;
 word-break:break-word;
}

.buttons{
 display:flex;
 gap:10px;
 margin-top:16px;
}

button{
 flex:1;
 border:0;
 padding:14px;
 border-radius:11px;
 font-size:12px;
 font-weight:bold;
 cursor:pointer;
 transition:.2s;
}

button:active{transform:scale(.97)}

.reset{
 background:#F0EBFF;
 border:1px solid #E0D5FF;
 color:#6841C2;
}

.print{background:#7652D6;color:white}

footer{
 text-align:center;
 padding:23px 0 5px;
 color:#AAA3B7;
 font-size:10px;
 letter-spacing:1.5px;
}

@media(max-width:360px){
 .note-row{
  grid-template-columns:77px minmax(0,1fr) 66px;
  gap:7px;
  padding:10px 7px;
 }
 .note-photo{width:75px;height:40px}
 .note-value{font-size:19px}
 .note-total{font-size:17px}
 .qty input{height:36px;font-size:14px}
}

@media(min-width:550px){
 .note-row{
  grid-template-columns:125px minmax(0,1fr) 100px;
  padding:13px 16px;
 }
 .note-photo{width:115px;height:56px}
}

@media print{
 body{background:white;padding:0}
 .buttons,.status{display:none}
 .hero,.grand{
  print-color-adjust:exact;
  -webkit-print-color-adjust:exact;
 }
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="brand">
  <div class="logo">₹</div>
  <div>
   <h1>RUPEEVAULT</h1>
   <small>INDIAN CASH COUNTER</small>
  </div>
 </div>
 <div class="status">● OFFLINE</div>
</header>

<section class="hero">
 <div class="hero-label">GRAND TOTAL</div>
 <div class="total" id="topTotal">₹0</div>
 <div class="hero-info">
  <span id="noteCount">0 Notes</span>
  <span id="activeCount">0 Active</span>
 </div>
</section>

<div class="heading">
 <h2>Cash Counter</h2>
 <span>Enter Quantity</span>
</div>

<div class="cash-box" id="cashBox"></div>

<section class="summary">
 <h3>Cash Summary</h3>

 <div class="summary-row">
  <span>Total Notes</span>
  <strong id="sumNotes">0</strong>
 </div>

 <div class="summary-row">
  <span>Active Notes</span>
  <strong id="sumTypes">0</strong>
 </div>

 <div class="summary-row">
  <span>Total Amount</span>
  <strong id="sumCash">₹0</strong>
 </div>

 <div class="grand">
  <div class="grand-label">GRAND TOTAL</div>
  <div class="grand-total" id="bottomTotal">₹0</div>
 </div>
</section>

<div class="buttons">
 <button class="reset" onclick="resetAll()">↺ RESET</button>
 <button class="print" onclick="window.print()">PRINT REPORT ↗</button>
</div>

<footer>RUPEEVAULT · SMART CASH COUNTER</footer>
</div>

<script>
const notes=[
 {v:10,img:"https://commons.wikimedia.org/wiki/Special:FilePath/India_new_10_INR,_MG_series,_2018,_obverse.jpg"},
 {v:20,img:"https://commons.wikimedia.org/wiki/Special:FilePath/India_new_20_INR,_MG_series,_2019,_obverse.jpg"},
 {v:50,img:"https://commons.wikimedia.org/wiki/Special:FilePath/India_new_50_INR,_MG_series,_2018,_obverse.jpg"},
 {v:100,img:"https://commons.wikimedia.org/wiki/Special:FilePath/India_new_100_INR,_Mahatma_Gandhi_New_Series,_2018,_obverse.png"},
 {v:200,img:"https://commons.wikimedia.org/wiki/Special:FilePath/India,_200_INR,_2018,_obverse.jpg"},
 {v:500,img:"https://commons.wikimedia.org/wiki/Special:FilePath/India_new_500_INR,_MG_series,_2016,_obverse.jpg"},
 {v:2000,img:"https://commons.wikimedia.org/wiki/Special:FilePath/India_new_2000_INR,_MG_series,_2016,_obverse.jpg"}
];

const KEY="rupeevault_violet_v5";
let saved={};

try{
 saved=JSON.parse(localStorage.getItem(KEY))||{};
}catch(e){saved={};}

const box=document.getElementById("cashBox");

function money(n){
 return "₹"+n.toLocaleString("en-IN");
}

function createRows(){
 box.innerHTML="";

 notes.forEach(note=>{
  const row=document.createElement("div");
  row.className="note-row";

  const img=document.createElement("img");
  img.className="note-photo";
  img.src=note.img;
  img.alt="₹"+note.v;
  img.onerror=()=>{img.style.visibility="hidden";};

  const info=document.createElement("div");
  info.className="note-info";

  const value=document.createElement("div");
  value.className="note-value";
  value.textContent="₹"+note.v;

  const total=document.createElement("div");
  total.className="note-total";
  total.id="amount-"+note.v;
  total.textContent="₹0";

  info.append(value,total);

  const qty=document.createElement("div");
  qty.className="qty";

  const label=document.createElement("label");
  label.textContent="QTY";

  const input=document.createElement("input");
  input.type="number";
  input.min="0";
  input.step="1";
  input.inputMode="numeric";
  input.placeholder="0";
  input.id="qty-"+note.v;
  input.value=saved[note.v]||"";
  input.addEventListener("input",calculate);

  qty.append(label,input);
  row.append(img,info,qty);
  box.appendChild(row);
 });

 calculate();
}

function calculate(){
 let total=0,count=0,active=0;
 let data={};

 notes.forEach(note=>{
  const input=document.getElementById("qty-"+note.v);
  let raw=input.value;
  let qty=Math.max(0,Math.floor(Number(raw)||0));

  if(raw!=="" && Number(raw)<0){
   input.value=0;
   qty=0;
  }

  if(raw!=="" && !Number.isInteger(Number(raw))){
   input.value=qty;
  }

  let amount=qty*note.v;
  total+=amount;
  count+=qty;
  if(qty>0)active++;

  data[note.v]=qty;

  document.getElementById("amount-"+note.v)
   .textContent=money(amount);
 });

 try{
  localStorage.setItem(KEY,JSON.stringify(data));
 }catch(e){}

 document.getElementById("topTotal").textContent=money(total);
 document.getElementById("bottomTotal").textContent=money(total);
 document.getElementById("noteCount").textContent=count.toLocaleString("en-IN")+" Notes";
 document.getElementById("activeCount").textContent=active+" Active";
 document.getElementById("sumNotes").textContent=count.toLocaleString("en-IN");
 document.getElementById("sumTypes").textContent=active;
 document.getElementById("sumCash").textContent=money(total);
}

function resetAll(){
 if(!confirm("Reset all quantities?"))return;

 notes.forEach(note=>{
  document.getElementById("qty-"+note.v).value="";
 });

 try{localStorage.removeItem(KEY);}catch(e){}
 calculate();
}

createRows();
</script>
</body>
</html>
